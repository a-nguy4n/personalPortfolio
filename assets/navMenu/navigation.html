<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Stamp Menu</title>

    <link rel="stylesheet" href="/assets/navMenu/navigation.css">
</head>
<body data-page="resume">

    <nav class="navbar">
        <div class="dropdown">
            <div class="navStamp-container">
                <img src="/assets/images/navigation/black-wave.png" alt="Wave Image" id="wave-image">
                
                <svg viewBox="0 0 400 200">
                    <ellipse id="outer-oval" cx="200" cy="100" rx="180" ry="80" fill="none" stroke="black" stroke-width="3.5"/>
                
                    <ellipse id="inner-oval" cx="200" cy="100" rx="130" ry="40" fill="black" stroke="black" stroke-width="3"/>
                
                    <path id="topInnerCurve" d="M 80 100 A 120 50 0 0 1 330 100" fill="none"/>
                    <text fill="black" id="topInnerCurve-text">
                        <textPath href="#topInnerCurve" startOffset="50%" text-anchor="middle">
                            Customs Clearance
                        </textPath>
                    </text>
                
                    <text x="200" y="105" text-anchor="middle" fill="black" id="innerCurve-text">
                        Routes
                    </text>
                </svg>
            </div>

            <div class="dropdown-menu">
                <div class="dropdown-content">
                    <div class="from-section">
                        <p id="fromNav"> From: </p>
                        <a href="#" class="from-link"> Home </a>
                    </div>
            
                    <div class="to-section">
                        <p id="toNav"> To: </p>
                        <section class="routes">
                            <a href="/index.html" id="home-hov">Home</a>
                            <a href="/pages/resume.html" id="resume-hov">Resume</a>
                            <a href="/pages/projects.html" id="projects-hov">Projects</a>
                            <a href="/caseStudies.html" id="caseStudies">Case Studies</a>
                            <a href="/extraDetails.html" id="extraDetails">Extra Details</a>
                            <a href="/pages/contactMe.html" id="contact-hov">Contact</a>
                        </section>
                    </div>
                </div>
            </div>
            
        </div>
    </nav>

    
   

    <script src="/assets/navMenu/navigation.js"></script>

</body>
</html>
