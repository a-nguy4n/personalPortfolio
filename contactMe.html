<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me Page</title>
    <link rel="stylesheet" href="css/contactMe.css">
</head>
<body>

    <h1 id="contactPageTitle"> Write to Me!</h1>

    <div class="contactPostcard">
        <section class="contactForm">
            <form action="https://httpbin.org/post" method="POST">
                <label for="fullName"> Full Name: <span class="required">*</span></label>
                <input type="text" id="fullName" name="fullName" required>
            
                <label for="phoneNumber"> Phone: <span class="required">*</span></label>
                <input type="tel" id="phoneNumber" name="phoneNumber" required>
            
                <label for="email"> Email: <span class="required">*</span></label>
                <input type="email" id="email" name="email" required>
            
                <label for="message">Message: <span class="required">*</span></label>
                <textarea id="message" name="message" rows="6" required></textarea>
            
                <input type="hidden" name="possible_bot" value="true">
            
                <button type="submit" class="send-button">Send</button>
            
                <output id="error-message"></output>
                <output id="info-message"></output>
            </form>
            
        </section>

        <hr class="contactVerticalHr">

        <section class="recipientSide">
            <div class="stamp">
                <img src="images/airplaneStamp.png" alt="Paper Plane Stamp">
            </div>

            <section class="address">
                <p id="contactTo"><strong>To:</strong></p>
                <p>Allison Nguyen</p>
                <p>1512alli@gmail.com</p>
                <p>Inbox Blvd, Let's Get in Touch, 0100</p>
            </section>
        </section>
    </div>

</body>
</html>
